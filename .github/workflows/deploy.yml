name: Deploy Global Enterprise to GitHub Pages

on:
  push:
    # GitLab is the release authority. Its mirror job pushes the gh-pages
    # commit and then an Ed25519-signed provenance tag; only that tag deploys.
    tags: [release-provenance-*]
  workflow_dispatch:
    inputs:
      provenance_assertion:
        description: "Canonical signed GitLab receipt JSON for the commit being deployed"
        required: false
        type: string
      provenance_signature:
        description: "Base64url Ed25519 signature for the GitLab receipt"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions repository variable; leave empty for local/static builds.
      # Production should point at the Front Door-backed brief Function route.
      PUBLIC_BRIEF_API_URL: ${{ vars.PUBLIC_BRIEF_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Extract signed GitLab release handoff
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$RELEASE_TAG" =~ ^release-provenance-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "${RELEASE_TAG#release-provenance-}" == "${GITHUB_SHA}"* ]]
          tag_contents="$(git for-each-ref --format='%(contents)' "refs/tags/${RELEASE_TAG}")"
          assertion="$(printf '%s\n' "$tag_contents" | sed -n 's/^provenance-assertion=//p' | head -n 1)"
          signature="$(printf '%s\n' "$tag_contents" | sed -n 's/^provenance-signature=//p' | head -n 1)"
          test -n "$assertion"
          test -n "$signature"
          {
            echo 'GITLAB_PROVENANCE_ASSERTION<<__GITLAB_ASSERTION__'
            printf '%s\n' "$assertion"
            echo '__GITLAB_ASSERTION__'
            echo "GITLAB_PROVENANCE_SIGNATURE=$signature"
          } >> "$GITHUB_ENV"
      - name: Use manually supplied provenance handoff
        if: github.event_name == 'workflow_dispatch'
        env:
          ASSERTION: ${{ inputs.provenance_assertion || secrets.GITLAB_PROVENANCE_ASSERTION }}
          SIGNATURE: ${{ inputs.provenance_signature || secrets.GITLAB_PROVENANCE_SIGNATURE }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'GITLAB_PROVENANCE_ASSERTION<<__GITLAB_ASSERTION__'
            printf '%s\n' "$ASSERTION"
            echo '__GITLAB_ASSERTION__'
            echo "GITLAB_PROVENANCE_SIGNATURE=$SIGNATURE"
          } >> "$GITHUB_ENV"
      - name: Verify mirrored release provenance
        env:
          # RELEASE_SHA identifies the received GitHub commit; the signed
          # GitLab receipt below is the authority for whether it may deploy.
          RELEASE_SHA: ${{ github.sha }}
          GITLAB_PROVENANCE_MODE: mirror
          GITLAB_REPOSITORY_PATH: WorldEnterpriseGroup/globalenterprise
          GITLAB_PROVENANCE_PUBLIC_KEY: ${{ vars.GITLAB_PROVENANCE_PUBLIC_KEY }}
        run: npm run audit:provenance
      - name: Install dependencies
        run: npm ci
      - name: Type and content checks
        run: npm run check
      - name: Evidence audit
        run: npm run audit:evidence
      - name: Build site
        run: npm run build
      - name: Security configuration and built-output audit
        run: npm run audit:security
      - name: Production route audit
        run: node scripts/audit-site.mjs
      - name: Verify GitHub Pages metadata is present
        run: test -f dist/.nojekyll && test -f dist/.well-known/security.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
  live-audit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Audit production routes
        run: npm run audit:live
      - name: Audit production security headers
        run: LIVE_SITE_URL=https://globalenterprise.com npm run audit:security
