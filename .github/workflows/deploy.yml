name: Deploy Global Enterprise to GitHub Pages

on:
  push:
    # GitHub Pages is configured to accept deployments from gh-pages only.
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions repository variable; leave empty for local/static builds.
      # Production should point at the Front Door-backed brief Function route.
      PUBLIC_BRIEF_API_URL: ${{ vars.PUBLIC_BRIEF_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security configuration audit
        run: npm run audit:security
      - name: Type and content checks
        run: npm run check
      - name: Evidence audit
        run: npm run audit:evidence
      - name: Build site
        run: npm run build
      - name: Production route audit
        run: node scripts/audit-site.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
