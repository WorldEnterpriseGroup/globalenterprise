include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: 7b817a720e9d89217ab74c08e8223909f51d8e26 # verified immutable Launch Sequence commit
    file: '/pipelines/static-site.yml'
variables:
  GITHUB_REPO: "WorldEnterpriseGroup/globalenterprise"
  SITE_DIR: "."
  BUILD_COMMANDS: "npm ci && npm run build && node scripts/prefix-pages-base.mjs"

# The shared Pages job defaults to Alpine without Node and otherwise copies
# the repository source tree. Build the static Astro output in a Node image
# and publish the contents of dist/ at the Pages document root.
pages:
  extends: .pages:deploy
  image: "${IMAGE_REGISTRY}/dockerhub-proxy/library/node:24-alpine"
  variables:
    SITE_DIR: "dist/."
    PAGES_BASE_PATH: "/globalenterprise"

# The mirror pushes the exact GitLab gh-pages commit and then an immutable,
# per-run signed tag. GitHub Pages deploys only from that tag, so a branch push
# without a GitLab-issued receipt cannot enter production.
mirror:
  # The GitLab runner enforces an unprivileged/read-only container. The Git
  # image supplies the VCS client; OpenSSL is installed into a temporary
  # writable root so the job never mutates the image filesystem.
  image: docker.io/alpine/git:v2.52.0
  before_script:
    - test -n "$GITHUB_TOKEN"
    - test -n "$GITLAB_PROVENANCE_PRIVATE_KEY_B64"
  script:
    - |
      set -eu
      release_tag="release-provenance-${CI_COMMIT_SHA}-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      assertion="{\"issuer\":\"gitlab-ci\",\"job_id\":\"${CI_JOB_ID}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"ref\":\"refs/heads/${CI_COMMIT_REF_NAME}\",\"repository\":\"${CI_PROJECT_PATH}\",\"sha\":\"${CI_COMMIT_SHA}\",\"version\":1}"
      key_file="$(mktemp)"
      assertion_file="$(mktemp)"
      signature_file="$(mktemp)"
      tools_root="$(mktemp -d)"
      trap 'rm -f "$key_file" "$assertion_file" "$signature_file"' EXIT
      umask 077
      apk --usermode --root "$tools_root" --initdb --no-cache --keys-dir /etc/apk/keys --repositories-file /etc/apk/repositories add openssl >/dev/null
      export PATH="$tools_root/usr/bin:$PATH"
      export LD_LIBRARY_PATH="$tools_root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      printf '%s' "$GITLAB_PROVENANCE_PRIVATE_KEY_B64" | base64 -d > "$key_file"
      printf '%s' "$assertion" > "$assertion_file"
      # OpenSSL 3.3 requires raw-input mode for Ed25519 signatures.
      openssl pkeyutl -sign -rawin -inkey "$key_file" -in "$assertion_file" -out "$signature_file"
      signature="$(base64 < "$signature_file" | tr -d '\n=' | tr '+/' '-_')"
      git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" 2>/dev/null || git remote set-url github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
      # GitLab checks out protected branch pipelines detached. Push the exact
      # commit SHA to the destination ref instead of assuming a local branch
      # exists in that runner.
      # Keep the destination branch append-only. A divergence is a release
      # incident to investigate, not a reason for CI to erase the remote ref.
      git push github "${CI_COMMIT_SHA}:refs/heads/gh-pages"
      git tag -a "$release_tag" "$CI_COMMIT_SHA" -m "provenance-assertion=$assertion" -m "provenance-signature=$signature"
      git push github "$release_tag"
      echo "Mirrored gh-pages and published signed release tag for ${CI_COMMIT_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true"'
