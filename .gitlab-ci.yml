include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: v0.2.5
    file: '/pipelines/static-site.yml'
variables:
  GITHUB_REPO: "WorldEnterpriseGroup/globalenterprise"
  SITE_DIR: "."
  BUILD_COMMANDS: "npm ci && npm run build && node scripts/prefix-pages-base.mjs"

# The shared Pages job defaults to Alpine without Node and otherwise copies
# the repository source tree. Build the static Astro output in a Node image
# and publish the contents of dist/ at the Pages document root.
pages:
  extends: .pages:deploy
  image: "${IMAGE_REGISTRY}/dockerhub-proxy/library/node:24-alpine"
  variables:
    SITE_DIR: "dist/."
    PAGES_BASE_PATH: "/globalenterprise"

# The shared mirror job is the source-side provenance gate: it runs from
# GitLab's detached CI checkout and must push exactly CI_COMMIT_SHA to GitHub.
# Materialize that branch locally so the mirror can publish it.
mirror:
  before_script:
    - git branch -f gh-pages "$CI_COMMIT_SHA"
