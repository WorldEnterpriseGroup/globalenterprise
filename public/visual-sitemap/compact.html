<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Enterprise Compact Visual Sitemap</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --ink:#10131d; --muted:#697181; --line:#d8dce4; --paper:#fff; --paper-soft:#f4f2ec; --accent:#315b8e; --left-width:80%; --right-width:20%; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; overflow:hidden; background:#eef1f4; color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app-shell { display:grid; grid-template-columns:var(--left-width) 6px var(--right-width); width:100%; height:100vh; overflow:hidden; }
    .content { min-width:0; height:100vh; overflow-y:auto; }
    header { padding:24px clamp(20px,4vw,54px) 20px; background:var(--paper); border-bottom:1px solid var(--line); }
    h1 { margin:0 0 5px; font:500 clamp(27px,3.2vw,40px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:-.045em; }
    .meta { margin:0; color:var(--muted); }
    .summary { display:flex; flex-wrap:wrap; gap:7px 20px; margin-top:12px; font-weight:650; }
    .directory-wrap { max-height:25vh; overflow-y:auto; padding:18px clamp(20px,4vw,54px); background:#f8f9fa; border-bottom:1px solid var(--line); }
    .directory-wrap h2 { margin:0 0 9px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .directory { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:3px 18px; margin:0; padding:0; list-style:none; }
    .directory a { display:flex; gap:7px; color:var(--ink); text-decoration:none; }
    .directory a:hover { color:var(--accent); text-decoration:underline; }
    .directory span { color:var(--accent); font-variant-numeric:tabular-nums; font-weight:800; }
    main { min-width:0; padding:18px 10px 50px clamp(20px,4vw,54px); }
    .group-title { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:0 0 9px; padding-bottom:7px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .group-title strong { color:var(--ink); font-size:16px; letter-spacing:0; text-transform:none; }
    .grid { display:grid; grid-template-columns:repeat(16,minmax(0,1fr)); align-items:start; gap:5px; margin-bottom:24px; }
    .card { position:relative; min-width:0; overflow:hidden; background:var(--paper); border:1px solid var(--line); border-radius:3px; scroll-margin-top:12px; cursor:zoom-in; }
    .card:hover,.card:focus-visible { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px; }
    .card.is-selected { outline:3px solid var(--accent); outline-offset:-3px; }
    .card-preview { display:flex; min-height:110px; flex-direction:column; justify-content:space-between; padding:9px; background:linear-gradient(135deg,#10131d,#18315d 58%,#315b8e); color:white; }
    .card-name { margin-top:13px; font-size:12px; font-weight:700; line-height:1.2; }
    .caption { padding:7px 8px 8px; border-top:1px solid var(--line); }
    .filename { font-size:11px; font-weight:750; word-break:break-word; }
    .title { margin-top:2px; color:var(--muted); font-size:10px; }
    .preview-shell { min-width:0; height:100vh; padding:12px; border-left:1px solid var(--line); background:#dfe3e7; }
    .preview { display:flex; flex-direction:column; height:100%; overflow:hidden; background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 3px 14px #1c273118; }
    .preview-header { flex:0 0 auto; padding:12px 13px; border-bottom:1px solid var(--line); }
    .preview-kicker { margin:0 0 3px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .preview-name { margin:0; font-size:14px; overflow-wrap:anywhere; }
    .preview-name a { color:inherit; text-decoration:none; }
    .preview-name a:hover { text-decoration:underline; color:var(--accent); }
    .preview-help { margin:8px 0 0; color:var(--muted); font-size:10px; }
    .preview-scroll { flex:1 1 auto; min-height:0; overflow:auto; background:#dfe3e7; }
    .preview-frame { display:block; width:100%; min-height:100%; height:1300px; border:0; background:white; }
    .splitter { width:6px; cursor:col-resize; background:var(--line); transition:background .15s; position:relative; z-index:10; height:100vh; }
    .splitter:hover, .splitter.active { background:var(--accent); }
    @media(max-width:1400px){.grid{grid-template-columns:repeat(12,minmax(0,1fr))}}
    @media(max-width:900px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
    @media(max-width:680px){body{overflow:auto}.app-shell{display:block;height:auto;overflow:visible}.content{height:auto;overflow:visible}main{padding-right:20px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.splitter{display:none}.preview-shell{height:70vh;padding:0 20px 24px;border-left:0}}
  </style>
</head>
<body>

      <nav class="directory-wrap" aria-label="Page directory">
        <h2>Page directory</h2>
        <ol class="directory" id="directory"></ol>
      </nav>
      <main id="main"></main>
    </div>
    <div class="splitter" role="separator" tabindex="0" aria-label="Resize preview pane"></div>
    <aside class="preview-shell" aria-label="Page preview">
      <div class="preview">
        <div class="preview-header">
          <p class="preview-kicker" id="preview-number">Page preview</p>
          <h2 class="preview-name" id="preview-name">Select a page</h2>
          <p class="preview-help">Click a card to preview the live route here. Click its title to open the page.</p>
        </div>
        <div class="preview-scroll"><iframe class="preview-frame" id="preview-frame" title="Selected page preview"></iframe></div>
      </div>
    </aside>
  </div>

    const directory = document.querySelector('#directory');

    const summary = document.querySelector('#summary');
    const previewName = document.querySelector('#preview-name');
    const previewFrame = document.querySelector('#preview-frame');
    const groups = [...new Set(pages.map((page) => page.group))];
    summary.replaceChildren(...[`${pages.length} pages`, `${groups.length} architecture groups`, 'all routes live'].map((text) => Object.assign(document.createElement('span'), {textContent:text})));

    function select(entry, card) {
      document.querySelectorAll('.card.is-selected').forEach((item) => item.classList.remove('is-selected'));
      card.classList.add('is-selected');
      previewName.replaceChildren();
      const link = document.createElement('a');
      link.href = entry.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = entry.file;
      previewName.append(link);
      previewFrame.src = entry.url;
    }

    groups.forEach((group) => {
      const groupPages = pages.filter((page) => page.group === group);
      const section = document.createElement('section');
      const title = document.createElement('h2');
      title.className = 'group-title';
      title.innerHTML = `<strong>${group}</strong><span>${groupPages.length} pages</span>`;
      section.append(title);
      const grid = document.createElement('div');
      grid.className = 'grid';
      groupPages.forEach((entry) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.id = `page-${entry.url.replaceAll('/', '-') || 'home'}`;
        card.tabIndex = 0;
        card.setAttribute('aria-label', entry.file);
        card.innerHTML = `<div class="card-preview"><span class="card-name">${entry.title}</span></div><div class="caption"><div class="filename">${entry.file}</div><div class="title">${entry.kind}</div></div>`;
        ['click','focus'].forEach((eventName) => card.addEventListener(eventName, () => select(entry, card)));
        grid.append(card);
        const item = document.createElement('li');
        item.innerHTML = `<a href="#page-${entry.url.replaceAll('/', '-') || 'home'}">${entry.file}</a>`;
        directory.append(item);
      });
      section.append(grid);
      main.append(section);
    });
    select(pages[0], document.querySelector('.card'));

    const splitter = document.querySelector('.splitter');
    let isResizing = false;
    splitter.addEventListener('mousedown', () => { isResizing = true; splitter.classList.add('active'); document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; });
    document.addEventListener('mousemove', (event) => { if (!isResizing) return; const total = document.body.getBoundingClientRect().width; const right = Math.max(260, Math.min(total * .5, total - event.clientX)); document.documentElement.style.setProperty('--left-width', `${(total-right-6)/total*100}%`); document.documentElement.style.setProperty('--right-width', `${right/total*100}%`); });
    document.addEventListener('mouseup', () => { isResizing = false; splitter.classList.remove('active'); document.body.style.cursor=''; document.body.style.userSelect=''; });
  </script>
